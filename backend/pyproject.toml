[project]
name = "rag-backend"
version = "0.1.0"
description = "RAG Engine Backend - FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.30.1",
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.32",
    "httpx==0.27.0",
    "redis==5.0.1",
    "pinecone==4.0.0",
    "voyageai==0.2.4",
    "groq==0.4.2",
    "google-generativeai==0.8.5",
    "pypdf==6.16.1",
    "python-docx==1.1.0",
    "tiktoken==0.7.0",
    "langchain-text-splitters==1.1.2",
    "tenacity==8.2.3",
    "structlog==24.1.0",
    "python-dotenv==1.2.3",
    "email-validator==2.1.0.post1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501", "UP037"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]